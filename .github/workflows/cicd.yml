name: Tests - Docker Hub - Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Évite deux mises à jour simultanées du conteneur ; ne coupe jamais un SSH en cours.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: 1 - Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -q

  e2e:
    name: 2 - Tests E2E HTTP
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/test-e2e.sh
        env:
          APP_VERSION: ${{ github.sha }}

  build_push:
    name: 3 - Build et publication Docker Hub
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Vérifier la configuration Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Secret DOCKERHUB_USERNAME absent'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Secret DOCKERHUB_TOKEN absent'; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et publier la version validée
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4 - Déploiement SSH et vérification publique
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: '8029'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Déployer le digest publié
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build_push.outputs.digest }}
        run: |
          export IMAGE_REF="$DOCKERHUB_USERNAME/tp-deploiement@$IMAGE_DIGEST"
          bash scripts/deploy-via-ssh.sh
      - run: python -m pip install -r requirements-dev.txt -r requirements-capture.txt
      - name: Vérifier les endpoints sur l'IP publique
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          export BASE_URL="http://$AZURE_HOST:$APP_PORT"
          bash scripts/test-e2e.sh
      - name: Capturer la page réellement déployée sur Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          python -m playwright install --with-deps chromium
          export BASE_URL="http://$AZURE_HOST:$APP_PORT"
          python scripts/capture.py
      - name: Conserver la preuve du déploiement
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: azure-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
